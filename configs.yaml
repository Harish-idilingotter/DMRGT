# DMRGT Phase 3 — single source of truth for universe, features, folds,
# costs, seeds, model IDs, graph parameters, tuning grids, and significance
# thresholds. Every module reads from this file; nothing that lives here
# may be hardcoded in script code.
#
# The universe / features / folds / cost blocks are IDENTICAL IN VALUE to
# Phase 2's configs.yaml — the cache was built against them and the hash
# check in train.py fails if they drift. Do not "improve" them.

# ─── Universe ──────────────────────────────────────────────────────────────
# 40 liquid S&P 100 constituents stratified across 8 GICS sectors,
# 5 per sector, plus the two global series (^GSPC, ^VIX) applied
# identically to every stock on a given date (features 7 and 8).
universe:
  tickers:
    # Information Technology (5)
    - AAPL
    - MSFT
    - NVDA
    - AVGO
    - CRM
    # Financials (5)
    - JPM
    - BRK-B
    - GS
    - BAC
    - V
    # Health Care (5)
    - JNJ
    - PFE
    - UNH
    - ABBV
    - MRK
    # Energy (5)
    - XOM
    - CVX
    - COP
    - SLB
    - EOG
    # Consumer Discretionary (5)
    - AMZN
    - HD
    - NKE
    - TSLA
    - SBUX
    # Consumer Staples (5)
    - PG
    - KO
    - WMT
    - COST
    - PEP
    # Industrials (5)
    - HON
    - CAT
    - BA
    - UPS
    - UNP
    # Utilities (5)
    - NEE
    - DUK
    - SO
    - AEP
    - EXC
  global_series:
    - ^GSPC      # S&P 500 index — feature 7 (market return)
    - ^VIX       # Volatility index — feature 8
  start_date: "2015-01-01"
  end_date:   "2024-12-31"

# ─── Sectors ───────────────────────────────────────────────────────────────
# GICS sector labels, shared by graph.py's sector-edge construction.
# Every universe ticker must appear here; global series are "global".
sectors:
  # Information Technology
  AAPL:  "Information Technology"
  MSFT:  "Information Technology"
  NVDA:  "Information Technology"
  AVGO:  "Information Technology"
  CRM:   "Information Technology"
  # Financials
  JPM:   "Financials"
  BRK-B: "Financials"
  GS:    "Financials"
  BAC:   "Financials"
  V:     "Financials"
  # Health Care
  JNJ:   "Health Care"
  PFE:   "Health Care"
  UNH:   "Health Care"
  ABBV:  "Health Care"
  MRK:   "Health Care"
  # Energy
  XOM:   "Energy"
  CVX:   "Energy"
  COP:   "Energy"
  SLB:   "Energy"
  EOG:   "Energy"
  # Consumer Discretionary
  AMZN:  "Consumer Discretionary"
  HD:    "Consumer Discretionary"
  NKE:   "Consumer Discretionary"
  TSLA:  "Consumer Discretionary"
  SBUX:  "Consumer Discretionary"
  # Consumer Staples
  PG:    "Consumer Staples"
  KO:    "Consumer Staples"
  WMT:   "Consumer Staples"
  COST:  "Consumer Staples"
  PEP:   "Consumer Staples"
  # Industrials
  HON:   "Industrials"
  CAT:   "Industrials"
  BA:    "Industrials"
  UPS:   "Industrials"
  UNP:   "Industrials"
  # Utilities
  NEE:   "Utilities"
  DUK:   "Utilities"
  SO:    "Utilities"
  AEP:   "Utilities"
  EXC:   "Utilities"
  # Global series
  ^GSPC: "global"
  ^VIX:  "global"

# ─── Features ──────────────────────────────────────────────────────────────
# Cached in features.parquet, UNSCALED. `columns` is the explicit list
# loaded by train.assemble_fold() — never infer the schema by
# string-matching parquet columns.
features:
  lookback_days: 30
  columns: [f1_logret, f2_price_ma, f3_rsi, f4_macd, f5_atr,
            f6_vol_zscore, f7_market_ret, f8_vix]
  # f1 log-return, f2 price/10d MA, f3 RSI(14), f4 MACD,
  # f5 ATR(14), f6 volume z-score, f7 market return, f8 VIX

# ─── Graph ─────────────────────────────────────────────────────────────────
# Baseline configuration (Phase 2's choice). §6b's sensitivity grid tests
# this choice; if a different configuration wins the grid, THIS block is
# updated to the winner and both cache/graphs.parquet and
# cache/graphs_frozen.parquet are rebuilt at it (Rule 22 / §6b.5).
graph:
  corr_window: 60           # trailing days of returns per correlation
  corr_method: pearson      # pearson | spearman — pearson built the cache
  k_pos: 8                  # top-k positive edges per stock
  k_neg: 4                  # bottom-k negative edges per stock
  symmetrise: false         # directed — preserves top-k asymmetry (Rule 12)
  include_sector: true
  min_history_days: 61      # corr_window + 1 (61 prices → 60 returns)

# ─── Models ────────────────────────────────────────────────────────────────
# Phase 3 trains exactly these two (Rule 20). Same DMRGT class, same
# hyperparameters — they differ ONLY in which edge table train.py joins
# in: dynamic daily edges (graphs.parquet) vs frozen per-fold edges
# (graphs_frozen.parquet).
models:
  ids: [dmrgt_all3, dmrgt_frozen]

# ─── Training ──────────────────────────────────────────────────────────────
training:
  seeds: [0, 1, 2, 3, 4]
  batch_size: 32
  epochs: 50
  learning_rate: 0.001
  huber_delta: 1.0
  early_stopping_patience: 10

# ─── Backtest / cost model ────────────────────────────────────────────────
# Costs are active from the first backtest run (Rule 5) and NEVER change
# between the two arms (Rule 19). The decile_fraction below is the FINAL
# post-processing configuration, declared in advance: the single-session
# rework (§0) has NO post-processing tuning stage — the only configuration
# search is the graph grid below.
backtest:
  commission_bps: 10     # 0.10% per trade
  slippage_bps: 5        # 0.05%
  decile_fraction: 0.2   # the book's size — final, not searched

# ─── (Post-processing tuning grid REMOVED — single-session rework) ────────
# The 36-config Tier 1 search (no_trade_band × decile_fraction ×
# smoothing_days) was dropped when the pipeline moved to one committed
# Kaggle session: identity post-processing (band 0, decile 0.2, smoothing
# 1) is applied IDENTICALLY to both arms, declared in advance (Rule 19).
# Rules 17/18 hold trivially — no post-processing decision is made at
# all, so none can be made after test data is observed.

# ─── Graph configuration sensitivity grid (§6b, Rule 22) ────────────────────
# One dimension varied at a time, the other two held at the Phase 2
# baseline. 7 configs, not 27. Searched on the DYNAMIC arm's VALIDATION
# predictions only (§1 of the single-session rework); the winner is frozen
# before the frozen graph is built in-session, and never revisited after
# test results are seen.
graph_grid:
  baseline: { k_pos: 8, k_neg: 4, corr_window: 60 }
  k_pos_sweep: [6, 8, 10]
  k_neg_sweep: [3, 4, 5]
  corr_window_sweep: [45, 60, 90]
  selection_metric: "sharpe"     # decided now, before any run

# ─── Significance testing (§6 of the single-session rework) ─────────────────
significance:
  wilcoxon_alpha: 0.05
  bootstrap_iterations: 5000
  bootstrap_block_length: 10

# ─── Walk-forward folds ───────────────────────────────────────────────────
# Identical to Phase 1/2. Train window expands chronologically; the
# latest ~15% of each training window is validation for early stopping.
# Hard constraint asserted in code: max(train) < min(test) on every fold.
folds:
  - name: "fold_1_2019_calm"
    train_start: "2015-01-01"
    train_end:   "2018-12-31"
    test_start:  "2019-01-01"
    test_end:    "2019-12-31"
  - name: "fold_2_2020_covid"
    train_start: "2015-01-01"
    train_end:   "2019-12-31"
    test_start:  "2020-01-01"
    test_end:    "2020-12-31"
  - name: "fold_3_2021"
    train_start: "2015-01-01"
    train_end:   "2020-12-31"
    test_start:  "2021-01-01"
    test_end:    "2021-12-31"
  - name: "fold_4_2022_rates"
    train_start: "2015-01-01"
    train_end:   "2021-12-31"
    test_start:  "2022-01-01"
    test_end:    "2022-12-31"